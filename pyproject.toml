# ---------------------------------------------------------------------------
# mypy: estrito por padrão; módulos legados listados com ignore_errors.
# Módulo novo NÃO aparece na lista, logo é checado em modo strict.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# psutil não publica tipos; evita depender de types-psutil só para um import.
module = ["psutil", "psutil.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# BASELINE HERDADA (F0-01): módulos que hoje falham em `mypy --strict`.
# Esta lista SÓ PODE ENCOLHER: ao tipar um módulo, remova-o daqui.
module = [
    "src.application.services.embedder_model_factory_service",
    "src.application.services.model_factory_service",
    "src.application.use_cases.get_active_agents_use_case",
    "src.domain.entities.agent_config",
    "src.domain.entities.tool",
    "src.infrastructure.cache.model_cache_service",
    "src.infrastructure.dependency_injection",
    "src.infrastructure.logging.config",
    "src.infrastructure.logging.decorators",
    "src.infrastructure.logging.logger_adapter",
    "src.infrastructure.logging.secure_logger",
    "src.infrastructure.logging.structlog_logger",
    "src.infrastructure.repositories.mongo_agent_config_repository",
    "src.infrastructure.repositories.mongo_base",
    "src.infrastructure.repositories.mongo_document_tree_repository",
    "src.infrastructure.repositories.mongo_team_config_repository",
    "src.infrastructure.repositories.mongo_tool_repository",
    "src.infrastructure.web.app_factory",
]
ignore_errors = true

# ---------------------------------------------------------------------------
# import-linter: regra de dependência da arquitetura onion/hexagonal.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "camadas"
name = "Camadas onion: domain <- application <- infrastructure | presentation"
type = "layers"
containers = ["src"]
layers = [
    "infrastructure | presentation",
    "application",
    "domain",
]
# Todo subpacote direto de src precisa estar declarado numa camada.
exhaustive = true
# BASELINE HERDADA (F0-01): violações existentes no commit 91a8a7a.
# Esta lista SÓ PODE ENCOLHER; não copie o padrão nem acrescente entradas.
ignore_imports = [
    "src.application.services.agent_factory_service -> src.infrastructure.tools.hierarchical_search_tool",
    "src.infrastructure.dependency_injection -> src.presentation.controllers.orquestrador_controller",
    "src.presentation.controllers.orquestrador_controller -> src.infrastructure.telemetry.metrics",
]

[[tool.importlinter.contracts]]
id = "nucleo-sem-frameworks"
name = "domain e application não importam frameworks nem drivers"
type = "forbidden"
source_modules = ["src.domain", "src.application"]
forbidden_modules = [
    "ag_ui",
    "agno",
    "bson",
    "chromadb",
    "dotenv",
    "fastapi",
    "google",
    "httpx",
    "motor",
    "ollama",
    "openai",
    "openinference",
    "opentelemetry",
    "psutil",
    "pymongo",
    "pypdf",
    "rich",
    "starlette",
    "structlog",
    "uvicorn",
    "uvloop",
]
# BASELINE HERDADA (F0-01): agno em application. Some na F2 (AgnoRuntime).
# Esta lista SÓ PODE ENCOLHER; não copie o padrão nem acrescente entradas.
# A aresta agent_factory_service -> infrastructure.tools.hierarchical_search_tool
# não é um import de framework: está aqui porque o contrato também checa cadeias
# indiretas, e hierarchical_search_tool importa agno (application -> infra -> agno).
# É a mesma aresta da baseline do contrato "camadas"; sai junto com ela.
ignore_imports = [
    "src.application.services.agent_factory_service -> agno",
    "src.application.services.agent_factory_service -> src.infrastructure.tools.hierarchical_search_tool",
    "src.application.services.model_factory_service -> agno",
    "src.application.services.team_factory_service -> agno",
    "src.application.use_cases.get_active_agents_use_case -> agno",
    "src.application.use_cases.get_active_teams_use_case -> agno",
]

# ---------------------------------------------------------------------------
# bandit (gate a partir da F1): `bandit -q -c pyproject.toml -r src`
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

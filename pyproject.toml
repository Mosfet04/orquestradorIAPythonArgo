# Configuração única das ferramentas de qualidade do projeto.
# Dependências NÃO ficam aqui: veja requirements.in / requirements.lock (runtime)
# e requirements-dev.in / requirements-dev.lock (desenvolvimento).

# ---------------------------------------------------------------------------
# pytest (migrado do antigo pytest.ini)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# unit/contract/integration/security/eval são aplicados por diretório em
# tests/conftest.py (não decore arquivo a arquivo); live é marcado no próprio teste.
markers = [
    "unit: testes unitários, sem I/O real (tests/unit, tests/golden)",
    "contract: mesma suíte para toda implementação de uma porta (tests/contract)",
    "integration: testes de integração entre camadas (tests/integration)",
    "security: testes de segurança (tests/security)",
    "eval: avaliações determinísticas com modelo roteirizado (tests/eval)",
    "live: depende de serviço externo real; nunca roda na CI padrão",
    "slow: marca testes que demoram para executar",
]
# Com pytest 9.0.2, `--strict-markers` em addopts (como estava no pytest.ini) não era
# aplicado: um marker não declarado passava. A opção de ini abaixo faz valer.
strict_markers = true
addopts = [
    "-v",
    "--tb=short",
    "--disable-warnings",
    "--color=yes",
    "--durations=10",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
log_cli = false
log_cli_level = "ERROR"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# coverage (usado por `pytest --cov`)
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", ".venv/*", "debug_scripts/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

# ---------------------------------------------------------------------------
# ruff (somente lint; `ruff format` fica fora da F0)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".claude", "logs", "mongo-init"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (flake8-bandit)
    "ASYNC",    # I/O bloqueante e armadilhas em código async
    "BLE",      # except Exception cego
    "LOG",      # uso de logging
    "G",        # formatação em chamadas de log
    "T20",      # print
    "PIE",      # pequenos anti-padrões
    "RUF",      # regras próprias do ruff
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# --- Permanente: assert é o mecanismo de asserção do pytest. ---
"tests/**" = ["S101"]
# --- Permanente: em app.py, load_dotenv() precisa rodar antes dos imports de src.
# O gate é `ruff check src tests app.py`. ---
"app.py" = ["E402"]
# --- BASELINE HERDADA (F0-01) ---

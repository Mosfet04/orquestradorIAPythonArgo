# num arquivo, corrija e remova o código daqui; nunca acrescente arquivo ou código.
# Arquivo novo não entra aqui, logo é checado com todas as regras.
# Legenda: UP006/UP007/UP015/UP017/UP035/UP045 = sintaxe antiga (typing.List,
# Optional, timezone.utc...); BLE001 = except Exception; S110 = try/except/pass;

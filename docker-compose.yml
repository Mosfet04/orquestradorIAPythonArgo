# Só a aplicação. MongoDB/Ollama externos vêm do .env (modelo em .env.example).
#   docker compose up -d
# Desenvolvimento com MongoDB, Ollama e mongo-express locais: docker-compose.dev.yml
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Credenciais nunca ficam aqui: ${VAR:?} faz o compose falhar se a variável faltar.
# Teste: tests/unit/test_container_hygiene.py

services:
  # AI Agents Orchestrator Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orquestrador-app
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      MONGO_CONNECTION_STRING: ${MONGO_CONNECTION_STRING:?defina MONGO_CONNECTION_STRING no .env}
      MONGO_DATABASE_NAME: ${MONGO_DATABASE_NAME:-agno}
      # Auth da borda (F1-04): o container faz bind em 0.0.0.0, então o app não sobe
      # sem as duas chaves; o compose falha antes, com mensagem, em vez de reiniciar em loop.
      API_KEY_RUN: ${API_KEY_RUN:?defina API_KEY_RUN no .env (ver .env.example)}
      API_KEY_ADMIN: ${API_KEY_ADMIN:?defina API_KEY_ADMIN no .env (ver .env.example)}
      APP_TITLE: ${APP_TITLE:-AI Agents Orchestrator}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Vazio = defaults do cliente ollama/agno (OLLAMA_HOST, localhost ou Ollama Cloud
      # com OLLAMA_API_KEY). O docker-compose.dev.yml aponta para o serviço "ollama".
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://grafana-lgtm:4317}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-orquestrador-ia}
      # Repasse puro (sem valor): vem do .env/shell se definida; se não, fica ausente no
      # container e vale o default do código (ENVIRONMENT: o production do Dockerfile).
      # APP_HOST/APP_PORT ficam com o Dockerfile.
      ENVIRONMENT:
      ENABLE_DOCS:
      CORS_ALLOWED_ORIGINS:
      AGNO_TELEMETRY:
      AWS_REGION:
      USE_TLS:
      TLS_ALLOW_INVALID_CERTIFICATES:
      OPENAI_API_KEY:
      ANTHROPIC_API_KEY:
      GEMINI_API_KEY:
      GROQ_API_KEY:
      OLLAMA_API_KEY:
      AZURE_API_KEY:
      AZURE_ENDPOINT:
      AZURE_VERSION:
    # Endurecimento: sem escalada de privilégio, sem capabilities, raiz somente leitura.
    # Nada grava em disco no runtime (logs vão para stdout); /tmp em memória.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - orquestrador-network

networks:
  orquestrador-network:
    driver: bridge
